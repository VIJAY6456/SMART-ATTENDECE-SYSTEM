<!DOCTYPE html>
<html>
<head>
    <title>Smart Attendance Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 30px; }
        h1 { color: #333; }
        select { padding: 8px; font-size: 16px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 0 8px rgba(0,0,0,0.1); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #4CAF50; color: white; }
        tr:hover { background: #f1f1f1; }
        .no-records { color: #888; padding: 20px; }
    </style>
</head>
<body>
    <h1>📋 Smart Attendance Dashboard</h1>

    <form method="get">
        <label for="date">Select Date: </label>
        <select name="date" id="date" onchange="this.form.submit()">
            {% for d in dates %}
                <option value="{{ d }}" {% if d == selected_date %}selected{% endif %}>{{ d }}</option>
            {% endfor %}
        </select>
    </form>

    {% if records %}
    <table>
        <tr><th>#</th><th>Roll No / Name</th><th>Time</th></tr>
        {% for r in records %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ r.id }}</td>
            <td>{{ r.time }}</td>
        </tr>
        {% endfor %}
    </table>
    <p>Total present: {{ records|length }}</p>
    {% else %}
    <p class="no-records">No attendance records for this date.</p>
    {% endif %}
</body>
</html>
